<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="25%" stop-color="#FBBC05" />
      <stop offset="50%" stop-color="#34A853" />
      <stop offset="75%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Gmail Brand Colors -->
    <linearGradient id="gmailRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <linearGradient id="gmailBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="gmailGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <linearGradient id="gmailYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Ambient Glow & Cards -->
    <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.75" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
    .font-badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="460" rx="28" fill="url(#bgGrad)" />
  
  <!-- Outer Border Accent -->
  <rect width="1196" height="456" x="2" y="2" rx="26" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="160" cy="140" r="170" fill="url(#glowRed)" filter="url(#glow)" />
  <circle cx="1080" cy="320" r="180" fill="#3B82F6" fill-opacity="0.14" filter="url(#glow)" />
  <circle cx="680" cy="420" r="150" fill="#10B981" fill-opacity="0.09" filter="url(#glow)" />

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.06" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="160" y1="0" x2="160" y2="460" />
    <line x1="340" y1="0" x2="340" y2="460" />
    <line x1="520" y1="0" x2="520" y2="460" />
    <line x1="700" y1="0" x2="700" y2="460" />
    <line x1="880" y1="0" x2="880" y2="460" />
    <line x1="1040" y1="0" x2="1040" y2="460" />
  </g>

  <!-- ================= LEFT HERO CARD (GMAIL AI BADGE) ================= -->
  <g transform="translate(70, 100)" filter="url(#cardShadow)">
    <!-- Base Glassmorphism Card -->
    <rect width="210" height="240" rx="32" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="206" height="236" x="2" y="2" rx="30" fill="none" stroke="url(#accentGrad)" stroke-width="1" stroke-opacity="0.35" />

    <!-- Gmail Styled M / Envelope Emblem -->
    <g transform="translate(42, 50) scale(1.25)">
      <!-- Envelope Background Shadow -->
      <path d="M 12 20 L 50 48 L 88 20 C 94 15 100 19 100 26 L 100 84 C 100 90 95 95 89 95 L 11 95 C 5 95 0 90 0 84 L 0 26 C 0 19 6 15 12 20 Z" fill="#0F172A" opacity="0.8"/>
      
      <!-- Left Red Wing -->
      <path d="M 0 28 L 0 84 C 0 89 4 94 10 94 L 28 94 L 28 48 L 0 28 Z" fill="url(#gmailRed)"/>
      <!-- Right Red Wing -->
      <path d="M 100 28 L 100 84 C 100 89 96 94 90 94 L 72 94 L 72 48 L 100 28 Z" fill="url(#gmailRed)"/>
      <!-- Yellow Fold -->
      <path d="M 28 48 L 50 64 L 72 48 L 72 94 L 28 94 Z" fill="url(#gmailYellow)" opacity="0.95"/>
      <!-- Blue Top Arch / Flap Left -->
      <path d="M 0 28 L 50 64 L 50 42 L 14 16 C 8 11 0 16 0 24 Z" fill="url(#gmailBlue)"/>
      <!-- Green Top Arch / Flap Right -->
      <path d="M 100 28 L 50 64 L 50 42 L 86 16 C 92 11 100 16 100 24 Z" fill="url(#gmailGreen)"/>
      
      <!-- Center Glowing AI Spark Core -->
      <circle cx="50" cy="53" r="6" fill="#FFFFFF" filter="url(#glow)"/>
      <circle cx="50" cy="53" r="3.5" fill="#6366F1"/>
    </g>

    <!-- Sub-label inside card -->
    <text x="105" y="205" fill="#94A3B8" class="font-mono" font-size="12" text-anchor="middle" letter-spacing="1.5">SECURE PROTOCOL</text>

    <!-- Floating Connection Nodes -->
    <circle cx="185" cy="35" r="4.5" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="25" cy="205" r="4" fill="#34D399" filter="url(#glow)"/>
  </g>

  <!-- ================= RIGHT CONTENT AREA ================= -->
  <g transform="translate(325, 75)">
    
    <!-- 1. TOP STATUS PILLS ROW -->
    <g transform="translate(0, 0)">
      <!-- Pill 1: Protocol -->
      <g transform="translate(0, 0)">
        <rect width="210" height="30" rx="15" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.8"/>
        <circle cx="18" cy="15" r="4" fill="#38BDF8">
          <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="114" y="20" fill="#38BDF8" class="font-badge" font-size="11.5" text-anchor="middle" letter-spacing="0.8">MODEL CONTEXT PROTOCOL</text>
      </g>

      <!-- Pill 2: MCP Version -->
      <g transform="translate(222, 0)">
        <rect width="135" height="30" rx="15" fill="#1E293B" stroke="#A855F7" stroke-width="1.2" stroke-opacity="0.8"/>
        <circle cx="18" cy="15" r="4" fill="#A855F7"/>
        <text x="76" y="20" fill="#C084FC" class="font-badge" font-size="11.5" text-anchor="middle" letter-spacing="0.8">MCP 2.x READY</text>
      </g>

      <!-- Pill 3: Python version -->
      <g transform="translate(369, 0)">
        <rect width="125" height="30" rx="15" fill="#1E293B" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.8"/>
        <circle cx="18" cy="15" r="4" fill="#10B981"/>
        <text x="71" y="20" fill="#34D399" class="font-badge" font-size="11.5" text-anchor="middle" letter-spacing="0.8">PYTHON 3.10+</text>
      </g>
    </g>

    <!-- 2. MAIN TITLE (With comfortable top margin) -->
    <g transform="translate(0, 80)">
      <text x="0" y="0" fill="#FFFFFF" class="font-title" font-size="50" letter-spacing="-0.5">
        Gmail <tspan fill="#EA4335">Manager</tspan> <tspan fill="#60A5FA">MCP</tspan>
      </text>
    </g>

    <!-- 3. SUBTITLE (Generous spacing below title) -->
    <g transform="translate(0, 125)">
      <text x="0" y="0" fill="#CBD5E1" class="font-sub" font-size="18.5" letter-spacing="0.2">
        High-performance AI agent email suite for Antigravity &amp; LLMs
      </text>
    </g>

    <!-- 4. FEATURE CHIPS ROW (Full width, padded & spaced cleanly) -->
    <g transform="translate(0, 175)">
      <!-- Chip 1: 14 Tools -->
      <g transform="translate(0, 0)">
        <rect width="165" height="38" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
        <text x="82" y="24" fill="#F8FAFC" class="font-mono" font-size="13" text-anchor="middle">⚡ 14 MCP Tools</text>
      </g>

      <!-- Chip 2: SSL/TLS -->
      <g transform="translate(177, 0)">
        <rect width="175" height="38" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
        <text x="87" y="24" fill="#F8FAFC" class="font-mono" font-size="13" text-anchor="middle">🔒 SSL / TLS IMAP</text>
      </g>

      <!-- Chip 3: Multi-part & HTML -->
      <g transform="translate(364, 0)">
        <rect width="195" height="38" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
        <text x="97" y="24" fill="#F8FAFC" class="font-mono" font-size="13" text-anchor="middle">📎 Attachments &amp; HTML</text>
      </g>

      <!-- Chip 4: AI Classifier -->
      <g transform="translate(571, 0)">
        <rect width="195" height="38" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
        <text x="97" y="24" fill="#F8FAFC" class="font-mono" font-size="13" text-anchor="middle">🧠 Smart AI Classifier</text>
      </g>
    </g>

    <!-- 5. SECONDARY FEATURE LINE -->
    <g transform="translate(0, 245)">
      <text x="0" y="0" fill="#64748B" class="font-sub" font-size="13.5" letter-spacing="0.3">
        ✓ No API Quota Limits  •  ✓ Threaded Replies  •  ✓ Zero Hardcoded Credentials  •  ✓ Stdio Fast Protocol
      </text>
    </g>

  </g>

  <!-- ================= RIGHT DECORATIVE TECH GRAPH ================= -->
  <g transform="translate(1060, 70)" opacity="0.8">
    <path d="M 0 60 L 55 15 L 115 50 L 85 135 L 0 60 Z" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="4,4"/>
    <path d="M 55 15 L 85 135 M 115 50 L 0 60" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    
    <circle cx="0" cy="60" r="7.5" fill="#EA4335" filter="url(#glow)"/>
    <circle cx="55" cy="15" r="6" fill="#34A853" filter="url(#glow)"/>
    <circle cx="115" cy="50" r="8" fill="#4285F4" filter="url(#glow)"/>
    <circle cx="85" cy="135" r="6.5" fill="#FBBC05" filter="url(#glow)"/>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="454" width="1200" height="6" fill="url(#accentGrad)" rx="3" />
</svg>
